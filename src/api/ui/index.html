<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chizu</title>
<script>
  // Set the theme before first paint: saved choice, else the system's.
  (() => {
    let theme;
    try { theme = localStorage.getItem("chizu-theme"); } catch {}
    if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="ponkotsu.css">
<style>
  [hidden] { display: none !important; }

  /* The handful of tailwind layout classes ponkotsu markup uses. */
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .flex-wrap { flex-wrap: wrap; }
  .flex-1 { flex: 1 1 0%; min-width: 0; }
  .items-center { align-items: center; }
  .items-end { align-items: flex-end; }
  .items-baseline { align-items: baseline; }
  .justify-end { justify-content: flex-end; }
  .self-start { align-self: flex-start; }
  .gap-1 { gap: 4px; }
  .gap-2 { gap: 8px; }
  .gap-4 { gap: 16px; }

  /* chizu's own pieces. */
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  .path { font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  .field { min-width: 10rem; }
  .lines { background: var(--color-c-surface-container-2); font-size: .875rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .lines .n { color: var(--color-c-on-surface-variant); display: inline-block; min-width: 3.5em; text-align: right; padding-right: .8em; user-select: none; }
  mark { background: var(--color-c-tertiary-container); color: var(--color-c-on-tertiary-container); border-radius: var(--radius-sm); }
  .error { color: var(--color-c-error); }
  summary { cursor: pointer; }
  dialog {
    width: min(960px, calc(100vw - 32px)); max-height: calc(100vh - 64px);
    border: 0; color: var(--color-c-on-surface);
  }
  dialog::backdrop { background: rgb(0 0 0 / .5); }
  dialog pre { background: var(--color-c-surface-container-2); white-space: pre-wrap; overflow-wrap: anywhere; font-size: .875rem; }
</style>
</head>
<body>
<main class="flex flex-col gap-4">
  <header class="flex flex-wrap items-center gap-2">
    <div class="flex-1 flex flex-col">
      <h1>chizu</h1>
      <small id="info" class="path"></small>
    </div>
    <nav class="flex gap-1" aria-label="View">
      <button type="button" data-view="search" class="btn-primary" aria-pressed="true">Search</button>
      <button type="button" data-view="files" class="btn-outlined" aria-pressed="false">Files</button>
    </nav>
    <button type="button" id="theme" aria-pressed="false">Light mode</button>
  </header>

  <form id="form" role="search" class="surface-1 flex flex-col gap-4">
    <div class="flex items-end gap-2">
      <label class="flex-1 flex flex-col gap-1">
        <span id="q-caption">Query</span>
        <input type="text" id="q" placeholder="Words, &quot;a phrase&quot;, or pre*" autofocus autocomplete="off">
      </label>
      <button class="btn-primary" type="submit" id="go">Search</button>
    </div>
    <div class="flex flex-wrap items-end gap-2">
      <label class="flex-1 field flex flex-col gap-1">
        Directory
        <input type="text" id="dir" placeholder="Any indexed directory">
      </label>
      <label class="flex-1 field flex flex-col gap-1">
        Path prefix
        <input type="text" id="path" placeholder="e.g. notes/">
      </label>
      <label class="flex-1 field flex flex-col gap-1">
        Extensions
        <input type="text" id="ext" placeholder="e.g. md,txt">
      </label>
      <label id="raw-label" class="flex items-center gap-2">
        <input type="checkbox" id="raw"> FTS5 syntax
      </label>
      <button type="button" id="reindex" hidden>Re-index</button>
    </div>
  </form>

  <small id="status" role="status" aria-live="polite"></small>
  <div id="results" class="flex flex-col gap-2"></div>
  <button type="button" id="more" class="self-start" hidden>Load more</button>

  <details class="surface-1">
    <summary>Indexed directories</summary>
    <ul id="roots" class="flex flex-col gap-1"></ul>
  </details>
</main>

<dialog id="viewer" class="surface-1" aria-labelledby="viewer-name">
  <div class="flex flex-col gap-2">
    <div class="flex items-center gap-2">
      <div class="flex-1 flex flex-col">
        <h2 id="viewer-name" class="path"></h2>
        <small id="viewer-path" class="path"></small>
      </div>
      <button type="button" id="viewer-close">Close</button>
    </div>
    <pre id="viewer-body"></pre>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...children);
  return e;
};

function segments(segs) {
  return (segs || []).map(s => s.match ? el("mark", { textContent: s.text }) : document.createTextNode(s.text));
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function setStatus(text, isError = false) {
  $("status").textContent = text;
  $("status").classList.toggle("error", isError);
}

// fileLink is a real link to the raw file (so middle-click works) that opens the viewer on a plain click.
function fileLink(f, text) {
  return el("a", {
    className: "path", href: "/api/file?raw=1&id=" + f.file_id, textContent: text,
    onclick: (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      openFile(f);
    },
  });
}

/* ---- theme ---- */

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("theme").setAttribute("aria-pressed", theme === "light");
}

$("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  applyTheme(next);
  try { localStorage.setItem("chizu-theme", next); } catch {}
});
applyTheme(document.documentElement.dataset.theme);

/* ---- views ---- */

const PAGE = 200;
let view = "search";
let seq = 0; // drops responses to requests that have been superseded

function filterParams() {
  const params = new URLSearchParams();
  for (const k of ["dir", "path", "ext"]) if ($(k).value.trim()) params.set(k, $(k).value.trim());
  return params;
}

function setView(v) {
  view = v;
  for (const b of document.querySelectorAll("nav button")) {
    const on = b.dataset.view === v;
    b.className = on ? "btn-primary" : "btn-outlined";
    b.setAttribute("aria-pressed", on);
  }
  $("q-caption").textContent = v === "files" ? "Filter by path" : "Query";
  $("q").placeholder = v === "files" ? "Part of a file name or path" : 'Words, "a phrase", or pre*';
  $("go").textContent = v === "files" ? "List" : "Search";
  $("raw-label").hidden = v === "files";
  $("results").replaceChildren();
  $("more").hidden = true;
  setStatus("");
  run();
}

function run() {
  if (view === "files") listFiles(false); else runSearch();
}

/* ---- search ---- */

async function runSearch() {
  const q = $("q").value.trim();
  if (!q) return;
  const id = ++seq;

  const params = filterParams();
  params.set("q", q);
  if ($("raw").checked) params.set("raw", "true");
  history.replaceState(null, "", "?" + params);
  params.set("lines", "5");
  params.set("limit", "50");

  setStatus("Searching…");
  try {
    const { results } = await api("/api/search?" + params);
    if (id !== seq) return;
    setStatus(results.length ? `${results.length} file${results.length === 1 ? "" : "s"}` : "No results");
    $("results").replaceChildren(...results.map(renderResult));
  } catch (err) {
    if (id !== seq) return;
    setStatus(err.message, true);
    $("results").replaceChildren();
  }
}

function renderResult(r) {
  const lines = el("pre", { className: "lines" });
  for (const l of r.lines || []) {
    lines.append(el("div", {}, el("span", { className: "n", textContent: l.line }), ...segments(l.segments)));
  }
  if (!r.lines || !r.lines.length) lines.append(...segments(r.snippet));

  const card = el("article", { className: "surface-1 flex flex-col gap-2" },
    el("div", { className: "flex flex-wrap items-baseline gap-2" },
      el("h4", { className: "flex-1" }, fileLink(r, r.path)),
      el("small", { className: "path", textContent: r.root })),
    lines);

  const more = r.line_count - (r.lines || []).length;
  if (more > 0) card.append(el("small", { textContent: `… ${more} more matching line${more === 1 ? "" : "s"}` }));
  return card;
}

/* ---- file list ---- */

async function listFiles(append) {
  const id = ++seq;
  const params = filterParams();
  const q = $("q").value.trim();
  if (q) params.set("q", q);
  const offset = append ? $("results").querySelectorAll("li").length : 0;

  const state = new URLSearchParams(params);
  state.set("view", "files");
  history.replaceState(null, "", "?" + state);

  params.set("limit", PAGE);
  params.set("offset", offset);
  if (!append) setStatus("Loading…");
  try {
    const { files, total } = await api("/api/files?" + params);
    if (id !== seq) return;
    if (!append) $("results").replaceChildren();

    // One panel per indexed directory; a page may continue the last one.
    let section = $("results").lastElementChild;
    for (const f of files) {
      if (!section || section.dataset.root !== f.root) {
        section = el("section", { className: "surface-1 flex flex-col gap-2" },
          el("h3", { className: "path", textContent: f.root }),
          el("ul", { className: "flex flex-col gap-1" }));
        section.dataset.root = f.root;
        $("results").append(section);
      }
      section.querySelector("ul").append(el("li", { className: "flex items-baseline gap-2" },
        el("span", { className: "flex-1" }, fileLink(f, f.path)),
        el("small", { textContent: formatSize(f.size) })));
    }

    const shown = offset + files.length;
    setStatus(total ? (shown < total ? `${shown} of ${total} files` : `${total} file${total === 1 ? "" : "s"}`) : "No files");
    $("more").hidden = shown >= total;
  } catch (err) {
    if (id !== seq) return;
    setStatus(err.message, true);
    $("results").replaceChildren();
    $("more").hidden = true;
  }
}

function formatSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

/* ---- viewer, roots, info ---- */

async function openFile(f) {
  $("viewer-name").textContent = f.path.split("/").pop();
  $("viewer-path").textContent = f.abs_path;
  $("viewer-body").textContent = "Loading…";
  $("viewer").showModal();
  try {
    const file = await api("/api/file?id=" + f.file_id);
    $("viewer-body").textContent = file.content;
  } catch (err) {
    $("viewer-body").textContent = err.message;
  }
}

async function loadRoots() {
  try {
    const { roots } = await api("/api/roots");
    if (!roots.length) {
      $("roots").replaceChildren(el("li", {}, el("small", { textContent: "Nothing is indexed yet. Run chizu index <dir>." })));
      return;
    }
    $("roots").replaceChildren(...roots.map(r => el("li", { className: "flex flex-wrap items-baseline gap-2" },
      el("a", {
        className: "path", href: "?view=files&dir=" + encodeURIComponent(r.path), textContent: r.path,
        title: "List its files",
        onclick: (e) => {
          if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          e.preventDefault();
          $("dir").value = r.path;
          $("q").value = "";
          setView("files");
        },
      }),
      el("small", { textContent: `${r.file_count} file${r.file_count === 1 ? "" : "s"}` }))));
  } catch (err) {
    $("roots").replaceChildren(el("li", { className: "error", textContent: err.message }));
  }
}

async function loadInfo() {
  try {
    const info = await api("/api/info");
    $("info").textContent = `${info.db} · ${info.tokenizer}`;
    $("reindex").hidden = info.read_only;
  } catch (err) {
    $("info").textContent = err.message;
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); run(); });
for (const b of document.querySelectorAll("nav button")) b.addEventListener("click", () => setView(b.dataset.view));
$("more").addEventListener("click", () => listFiles(true));
$("viewer-close").addEventListener("click", () => $("viewer").close());
$("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) $("viewer").close(); });

let typing;
for (const id of ["q", "dir", "path", "ext"]) {
  $(id).addEventListener("input", () => {
    if (view !== "files") return;
    clearTimeout(typing);
    typing = setTimeout(() => listFiles(false), 200);
  });
}

$("reindex").addEventListener("click", async () => {
  $("reindex").disabled = true;
  setStatus("Re-indexing…");
  try {
    const { stats, errors } = await api("/api/index", { method: "POST", body: "{}" });
    const sum = (k) => stats.reduce((n, s) => n + s[k], 0);
    setStatus(`Re-indexed: ${sum("added")} added, ${sum("updated")} updated, ${sum("removed")} removed` +
      (errors.length ? ` · ${errors.join("; ")}` : ""), errors.length > 0);
    loadRoots();
    if (view === "files") listFiles(false);
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("reindex").disabled = false;
  }
});

const initial = new URLSearchParams(location.search);
for (const k of ["q", "dir", "path", "ext"]) if (initial.get(k)) $(k).value = initial.get(k);
$("raw").checked = initial.get("raw") === "true";

loadInfo();
loadRoots();
if (initial.get("view") === "files") setView("files");
else if ($("q").value) runSearch();
</script>
</body>
</html>
