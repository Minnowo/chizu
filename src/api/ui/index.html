<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chizu</title>
<script>
  // Set the theme before first paint: saved choice, else the system's.
  (() => {
    let theme;
    try { theme = localStorage.getItem("chizu-theme"); } catch {}
    if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="ponkotsu.css">
<style>
  [hidden] { display: none !important; }

  /* The handful of tailwind layout classes ponkotsu markup uses. */
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .flex-wrap { flex-wrap: wrap; }
  .flex-1 { flex: 1 1 0%; min-width: 0; }
  /* A starting width for a flex-1 item, so its row wraps instead of squeezing it. */
  .basis-48 { flex-basis: 12rem; }
  .basis-64 { flex-basis: 16rem; }
  .items-center { align-items: center; }
  .items-end { align-items: flex-end; }
  .items-baseline { align-items: baseline; }
  .justify-end { justify-content: flex-end; }
  .self-start { align-self: flex-start; }
  .gap-1 { gap: 4px; }
  .gap-2 { gap: 8px; }
  .gap-4 { gap: 16px; }

  /* chizu's own pieces. */
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  .path { font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  .field { min-width: 10rem; }
  .lines { background: var(--color-c-surface-container-2); font-size: .875rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .n { color: var(--color-c-on-surface-variant); display: inline-block; min-width: 3.5em; text-align: right; padding-right: .8em; user-select: none; }
  mark { background: var(--color-c-tertiary-container); color: var(--color-c-on-tertiary-container); border-radius: var(--radius-sm); }
  .error { color: var(--color-c-error); }
  summary { cursor: pointer; }
  dialog {
    width: min(960px, calc(100vw - 16px)); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px);
    border: 0; color: var(--color-c-on-surface);
  }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgb(0 0 0 / .5); }
  dialog pre { flex: 1; min-height: 0; overflow: auto; background: var(--color-c-surface-container-2); white-space: pre-wrap; overflow-wrap: anywhere; font-size: .875rem; }
  #viewer-body > div { display: flex; }
  #viewer-body > div > :last-child { flex: 1; min-width: 0; }
  #viewer-body .n { flex: none; min-width: calc(var(--digits, 3) * 1ch + .8em); }
  #viewer-body.nowrap { white-space: pre; overflow-wrap: normal; }
  #viewer-body.nowrap > div { width: max-content; min-width: 100%; }
  #viewer-body .hit { background: var(--color-c-primary-hover-tint); }
  #viewer-body .current { background: var(--color-c-primary-focus-tint); }
  #viewer-body .def { background: var(--color-c-secondary-hover-tint); }
  .tag {
    font-size: .75rem; padding: 0 .5em; border-radius: var(--radius-sm); white-space: nowrap;
    background: var(--color-c-secondary-container); color: var(--color-c-on-secondary-container);
  }
  .tag.live { background: var(--color-c-success-container); color: var(--color-c-on-success-container); }
  #viewer-main { display: flex; gap: 8px; flex: 1; min-height: 0; }
  #viewer-main pre { min-width: 0; }
  #viewer-outline { flex: none; width: min(16rem, 40%); overflow: auto; font-size: .875rem; }
  #viewer-outline a { display: flex; gap: .5em; align-items: baseline; padding: 2px 4px; border-radius: var(--radius-sm); text-decoration: none; overflow-wrap: anywhere; }
  #viewer-outline a:hover, #viewer-outline a[aria-current] { background: var(--color-c-secondary-hover-tint); }
  #viewer-outline small { color: var(--color-c-on-surface-variant); }
  /* Too narrow for two columns: the outline goes above the file. */
  @media (max-width: 640px) {
    #viewer-main { flex-direction: column; }
    #viewer-outline { width: auto; max-height: 35%; }
  }
</style>
</head>
<body>
<main class="flex flex-col gap-4">
  <header class="flex flex-wrap items-center gap-2">
    <div class="flex-1 basis-48 flex flex-col">
      <div class="flex items-center gap-2">
        <h1>chizu</h1>
        <small id="watching" class="tag live" title="Started with --watch: files are re-indexed as they change" hidden>watching</small>
      </div>
      <small id="info" class="path"></small>
    </div>
    <nav class="flex gap-1" aria-label="View">
      <button type="button" data-view="search" class="btn-primary" aria-pressed="true">Search</button>
      <button type="button" data-view="defs" class="btn-outlined" aria-pressed="false">Definitions</button>
      <button type="button" data-view="files" class="btn-outlined" aria-pressed="false">Files</button>
    </nav>
    <label class="flex items-center gap-2">
      <input type="checkbox" id="theme"> Light mode
    </label>
  </header>

  <form id="form" role="search" class="surface-1 flex flex-col gap-4">
    <div class="flex items-end gap-2">
      <label class="flex-1 flex flex-col gap-1">
        Query
        <input type="text" id="q" placeholder="Words, &quot;a phrase&quot;, or pre*" autofocus autocomplete="off">
      </label>
      <button class="btn-primary" type="submit" id="go">Search</button>
    </div>
    <div class="flex flex-wrap items-end gap-2">
      <label class="flex-1 field flex flex-col gap-1">
        Directory
        <input type="text" id="dir" placeholder="Any indexed directory">
      </label>
      <label class="flex-1 field flex flex-col gap-1">
        Path prefix
        <input type="text" id="path" placeholder="e.g. notes/">
      </label>
      <label class="flex-1 field flex flex-col gap-1">
        Extensions
        <input type="text" id="ext" placeholder="e.g. md,txt">
      </label>
      <label id="raw-label" class="flex items-center gap-2">
        <input type="checkbox" id="raw"> FTS5 syntax
      </label>
      <button type="button" id="reindex" hidden>Re-index</button>
    </div>
  </form>

  <small id="status" role="status" aria-live="polite"></small>
  <div id="results" class="flex flex-col gap-2"></div>
  <button type="button" id="more" class="self-start" hidden>Load more</button>

  <details class="surface-1">
    <summary>Indexed directories</summary>
    <ul id="roots" class="flex flex-col gap-1"></ul>
  </details>
</main>

<dialog id="viewer" class="surface-1 gap-2" aria-labelledby="viewer-name">
  <div class="flex flex-wrap items-center gap-2">
    <div class="flex-1 basis-64 flex flex-col">
      <h2 id="viewer-name" class="path"></h2>
      <small id="viewer-path" class="path"></small>
    </div>
    <div id="viewer-nav" class="flex flex-wrap items-center gap-2" hidden>
      <small id="viewer-pos" aria-live="polite"></small>
      <button type="button" id="viewer-prev">Previous</button>
      <button type="button" id="viewer-next">Next</button>
    </div>
    <label id="viewer-outline-label" class="flex items-center gap-2" hidden>
      <input type="checkbox" id="viewer-outline-toggle" checked> Outline
    </label>
    <label class="flex items-center gap-2">
      <input type="checkbox" id="viewer-wrap" checked> Wrap lines
    </label>
    <button type="button" id="viewer-close">Close</button>
  </div>
  <div id="viewer-main">
    <aside id="viewer-outline" class="surface-2" aria-label="Definitions in this file" hidden></aside>
    <pre id="viewer-body"></pre>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...children);
  return e;
};

function segments(segs) {
  return (segs || []).map(s => s.match ? el("mark", { textContent: s.text }) : document.createTextNode(s.text));
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function setStatus(text, isError = false) {
  $("status").textContent = text;
  $("status").classList.toggle("error", isError);
}

// fileLink is a real link to the raw file (so middle-click works) that opens
// the viewer on a plain click, highlighting query's matches if given, or
// the lines of focus ({line, end_line}).
function fileLink(f, text, query, focus) {
  return el("a", {
    className: "path", href: "/api/file?raw=1&id=" + f.file_id, textContent: text,
    onclick: (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      openFile(f, query, focus);
    },
  });
}

/* ---- theme ---- */

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("theme").checked = theme === "light";
}

$("theme").addEventListener("change", () => {
  const next = $("theme").checked ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("chizu-theme", next); } catch {}
});
applyTheme(document.documentElement.dataset.theme);

/* ---- views ---- */

const PAGE = 200;
let view = "search";
let seq = 0; // drops responses to requests that have been superseded

function filterParams() {
  const params = new URLSearchParams();
  for (const k of ["dir", "path", "ext"]) if ($(k).value.trim()) params.set(k, $(k).value.trim());
  return params;
}

const VIEWS = {
  search: { caption: "Query", placeholder: 'Words, "a phrase", or pre*', go: "Search" },
  defs: { caption: "Name", placeholder: "A function, type or method, e.g. Open or Store.Open", go: "Find" },
  files: { caption: "Filter by path", placeholder: "Part of a file name or path", go: "List" },
};

function setView(v) {
  view = v;
  for (const b of document.querySelectorAll("header nav button")) {
    const on = b.dataset.view === v;
    b.className = on ? "btn-primary" : "btn-outlined";
    b.setAttribute("aria-pressed", on);
  }
  $("q").labels[0].firstChild.nodeValue = VIEWS[v].caption; // the label's text, before the input
  $("q").placeholder = VIEWS[v].placeholder;
  $("go").textContent = VIEWS[v].go;
  $("raw-label").hidden = v !== "search";
  $("results").replaceChildren();
  $("more").hidden = true;
  setStatus("");
  run();
}

function run() {
  if (view === "files") listFiles(false);
  else if (view === "defs") findDefs();
  else runSearch();
}

/* ---- search ---- */

async function runSearch() {
  const q = $("q").value.trim();
  if (!q) return;
  const id = ++seq;

  const params = filterParams();
  params.set("q", q);
  if ($("raw").checked) params.set("raw", "true");
  history.replaceState(null, "", "?" + params);
  params.set("lines", "5");
  params.set("limit", "50");

  const query = { q, raw: $("raw").checked };
  setStatus("Searching…");
  try {
    const { results } = await api("/api/search?" + params);
    if (id !== seq) return;
    setStatus(results.length ? `${results.length} file${results.length === 1 ? "" : "s"}` : "No results");
    $("results").replaceChildren(...results.map(r => renderResult(r, query)));
  } catch (err) {
    if (id !== seq) return;
    setStatus(err.message, true);
    $("results").replaceChildren();
  }
}

function renderResult(r, query) {
  const lines = el("pre", { className: "lines" });
  for (const l of r.lines || []) {
    lines.append(el("div", {}, el("span", { className: "n", textContent: l.line }), ...segments(l.segments)));
  }
  if (!r.lines || !r.lines.length) lines.append(...segments(r.snippet));

  const card = el("article", { className: "surface-1 flex flex-col gap-2" },
    el("div", { className: "flex flex-wrap items-baseline gap-2" },
      el("h4", { className: "flex-1 basis-64" }, fileLink(r, r.path, query)),
      el("small", { className: "path", textContent: r.root })),
    lines);

  const more = r.line_count - (r.lines || []).length;
  if (more > 0) card.append(el("small", { textContent: `… ${more} more matching line${more === 1 ? "" : "s"}` }));
  return card;
}

/* ---- definitions ---- */

async function findDefs() {
  const name = $("q").value.trim();
  if (!name) return;
  const id = ++seq;

  const params = filterParams();
  params.set("name", name);
  const state = new URLSearchParams(params);
  state.set("view", "defs");
  state.set("q", name);
  state.delete("name");
  history.replaceState(null, "", "?" + state);
  params.set("limit", "50");

  setStatus("Looking up…");
  try {
    const { definitions } = await api("/api/def?" + params);
    if (id !== seq) return;
    const n = definitions.length;
    if (!n) setStatus("No definitions. Search finds uses, and names in files chizu does not parse.");
    else setStatus((definitions[0].exact ? "" : "No exact match; names containing it: ") +
      `${n} definition${n === 1 ? "" : "s"}`);
    const files = new Map(); // file id -> its lines, shared by the cards' source panels
    $("results").replaceChildren(...definitions.map(d => renderDef(d, files)));
  } catch (err) {
    if (id !== seq) return;
    setStatus(err.message, true);
    $("results").replaceChildren();
  }
}

function renderDef(d, files) {
  const name = d.parent ? `${d.parent}.${d.name}` : d.name;
  const range = d.end_line > d.line ? `lines ${d.line}–${d.end_line}` : `line ${d.line}`;

  const source = el("details", {},
    el("summary", {}, el("small", { textContent: `Source, ${range}` })),
    el("pre", { className: "lines", textContent: "Loading…" }));
  source.addEventListener("toggle", async () => {
    if (!source.open || source.dataset.loaded) return;
    source.dataset.loaded = "1";
    const pre = source.querySelector("pre");
    try {
      if (!files.has(d.file_id)) files.set(d.file_id, api("/api/file?id=" + d.file_id).then(f => f.content.split("\n")));
      const lines = (await files.get(d.file_id)).slice(d.line - 1, d.end_line);
      pre.replaceChildren(...lines.map((text, i) => el("div", {},
        el("span", { className: "n", textContent: d.line + i }), text.replace(/\r$/, ""))));
    } catch (err) {
      delete source.dataset.loaded;
      pre.textContent = err.message;
    }
  });

  return el("article", { className: "surface-1 flex flex-col gap-2" },
    el("div", { className: "flex flex-wrap items-baseline gap-2" },
      el("span", { className: "tag", textContent: d.kind }),
      el("h4", { className: "path", textContent: name }),
      el("span", { className: "flex-1 basis-64" }, fileLink(d, `${d.path}:${d.line}`, null, d)),
      el("small", { className: "path", textContent: d.root })),
    el("pre", { className: "lines" }, el("div", {},
      el("span", { className: "n", textContent: d.line }), d.signature)),
    source);
}

/* ---- file list ---- */

async function listFiles(append) {
  const id = ++seq;
  const params = filterParams();
  const q = $("q").value.trim();
  if (q) params.set("q", q);
  const offset = append ? $("results").querySelectorAll("li").length : 0;

  const state = new URLSearchParams(params);
  state.set("view", "files");
  history.replaceState(null, "", "?" + state);

  params.set("limit", PAGE);
  params.set("offset", offset);
  if (!append) setStatus("Loading…");
  try {
    const { files, total } = await api("/api/files?" + params);
    if (id !== seq) return;
    if (!append) $("results").replaceChildren();

    // One panel per indexed directory; a page may continue the last one.
    let section = $("results").lastElementChild;
    for (const f of files) {
      if (!section || section.dataset.root !== f.root) {
        section = el("section", { className: "surface-1 flex flex-col gap-2" },
          el("h3", { className: "path", textContent: f.root }),
          el("ul", { className: "flex flex-col gap-1" }));
        section.dataset.root = f.root;
        $("results").append(section);
      }
      section.querySelector("ul").append(el("li", { className: "flex items-baseline gap-2" },
        el("span", { className: "flex-1" }, fileLink(f, f.path)),
        el("small", { textContent: formatSize(f.size) })));
    }

    const shown = offset + files.length;
    setStatus(total ? (shown < total ? `${shown} of ${total} files` : `${total} file${total === 1 ? "" : "s"}`) : "No files");
    $("more").hidden = shown >= total;
  } catch (err) {
    if (id !== seq) return;
    setStatus(err.message, true);
    $("results").replaceChildren();
    $("more").hidden = true;
  }
}

function formatSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

/* ---- viewer, roots, info ---- */

let rows = [];  // the viewer's line elements
let hits = [];  // its matching line elements
let current = -1;
let opened = 0; // drops a file's responses once another file is opened

async function openFile(f, query, focus) {
  const id = ++opened;
  $("viewer-name").textContent = f.path.split("/").pop();
  $("viewer-path").textContent = f.abs_path;
  $("viewer-body").textContent = "Loading…";
  $("viewer-nav").hidden = true;
  $("viewer-outline").replaceChildren();
  showOutline(false);
  rows = [];
  hits = [];
  current = -1;
  $("viewer").showModal();

  const params = new URLSearchParams({ id: f.file_id });
  if (query) {
    params.set("q", query.q);
    if (query.raw) params.set("fts", "true");
  }
  // The outline is extra: a file without one still opens.
  const outline = api("/api/outline?id=" + f.file_id).then(o => o.symbols, () => []);
  try {
    const file = await api("/api/file?" + params);
    if (id !== opened) return;
    renderFile(file.content, file.matches || []);
    if (focus) showLines(focus.line, focus.end_line);
  } catch (err) {
    if (id === opened) $("viewer-body").textContent = err.message;
    return;
  }
  const symbols = await outline;
  if (id === opened) renderOutline(symbols);
}

function renderOutline(symbols) {
  $("viewer-outline").replaceChildren(...symbols.map(s => {
    const a = el("a", {
      href: "#", title: `${s.kind} ${s.name}, lines ${s.line}–${s.end_line}`,
      onclick: (e) => {
        e.preventDefault();
        for (const other of $("viewer-outline").querySelectorAll("[aria-current]")) other.removeAttribute("aria-current");
        a.setAttribute("aria-current", "true");
        showLines(s.line, s.end_line);
      },
    }, el("span", { textContent: s.name }), el("small", { textContent: s.kind }));
    a.style.paddingLeft = `calc(4px + ${s.depth}em)`;
    return a;
  }));
  $("viewer-outline-label").hidden = symbols.length === 0;
  // Open unless closed before; on a phone, closed unless opened before.
  let saved = null;
  try { saved = localStorage.getItem("chizu-outline"); } catch {}
  const open = saved === null ? !matchMedia("(max-width: 640px)").matches : saved === "true";
  showOutline(symbols.length > 0 && open);
}

function showOutline(open) {
  $("viewer-outline").hidden = !open;
  $("viewer-outline-toggle").checked = open;
}

// showLines marks lines start..end (1-based) and scrolls to the first.
function showLines(start, end) {
  for (const r of $("viewer-body").querySelectorAll(".def")) r.classList.remove("def");
  for (let i = start - 1; i < Math.min(end, rows.length); i++) rows[i].classList.add("def");
  rows[start - 1]?.scrollIntoView({ block: "start" });
}

function renderFile(content, matches) {
  const marked = new Map(matches.map(m => [m.line, m.segments]));
  const lines = content.split("\n");
  const body = $("viewer-body");
  body.style.setProperty("--digits", String(lines.length).length);

  const frag = document.createDocumentFragment();
  lines.forEach((text, i) => {
    const segs = marked.get(i + 1);
    const row = el("div", {},
      el("span", { className: "n", textContent: i + 1 }),
      el("span", {}, ...(segs ? segments(segs) : [text.replace(/\r$/, "")])));
    rows.push(row);
    if (segs) {
      row.className = "hit";
      hits.push(row);
    }
    frag.append(row);
  });
  body.replaceChildren(frag);
  body.scrollTop = 0;

  $("viewer-nav").hidden = hits.length === 0;
  if (hits.length) goToMatch(0);
}

function goToMatch(i) {
  if (!hits.length) return;
  hits[current]?.classList.remove("current");
  current = (i + hits.length) % hits.length;
  hits[current].classList.add("current");
  hits[current].scrollIntoView({ block: "center" });
  $("viewer-pos").textContent = `Line ${hits[current].firstChild.textContent}, match ${current + 1} of ${hits.length}`;
}

async function loadRoots() {
  try {
    const { roots } = await api("/api/roots");
    if (!roots.length) {
      $("roots").replaceChildren(el("li", {}, el("small", { textContent: "Nothing is indexed yet. Run chizu index <dir>." })));
      return;
    }
    $("roots").replaceChildren(...roots.map(r => el("li", { className: "flex flex-wrap items-baseline gap-2" },
      el("a", {
        className: "path", href: "?view=files&dir=" + encodeURIComponent(r.path), textContent: r.path,
        title: "List its files",
        onclick: (e) => {
          if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          e.preventDefault();
          $("dir").value = r.path;
          $("q").value = "";
          setView("files");
        },
      }),
      el("small", { textContent: `${r.file_count} file${r.file_count === 1 ? "" : "s"}` }))));
  } catch (err) {
    $("roots").replaceChildren(el("li", { className: "error", textContent: err.message }));
  }
}

async function loadInfo() {
  try {
    const info = await api("/api/info");
    $("info").textContent = `${info.db} · ${info.tokenizer}`;
    $("reindex").hidden = info.read_only;
    $("watching").hidden = !info.watching;
  } catch (err) {
    $("info").textContent = err.message;
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); run(); });
for (const b of document.querySelectorAll("header nav button")) b.addEventListener("click", () => setView(b.dataset.view));
$("more").addEventListener("click", () => listFiles(true));
$("viewer-close").addEventListener("click", () => $("viewer").close());
function applyWrap(wrap) {
  $("viewer-body").classList.toggle("nowrap", !wrap);
  $("viewer-wrap").checked = wrap;
}
$("viewer-wrap").addEventListener("change", () => {
  const wrap = $("viewer-wrap").checked;
  applyWrap(wrap);
  try { localStorage.setItem("chizu-wrap", wrap); } catch {}
  hits[current]?.scrollIntoView({ block: "center" });
});
try { applyWrap(localStorage.getItem("chizu-wrap") !== "false"); } catch { applyWrap(true); }
$("viewer-outline-toggle").addEventListener("change", () => {
  const open = $("viewer-outline-toggle").checked;
  showOutline(open);
  try { localStorage.setItem("chizu-outline", open); } catch {}
});
$("viewer-prev").addEventListener("click", () => goToMatch(current - 1));
$("viewer-next").addEventListener("click", () => goToMatch(current + 1));
$("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) $("viewer").close(); });

let typing;
for (const id of ["q", "dir", "path", "ext"]) {
  $(id).addEventListener("input", () => {
    if (view !== "files") return;
    clearTimeout(typing);
    typing = setTimeout(() => listFiles(false), 200);
  });
}

$("reindex").addEventListener("click", async () => {
  $("reindex").disabled = true;
  setStatus("Re-indexing…");
  try {
    const { stats, errors } = await api("/api/index", { method: "POST", body: "{}" });
    const sum = (k) => stats.reduce((n, s) => n + s[k], 0);
    setStatus(`Re-indexed: ${sum("added")} added, ${sum("updated")} updated, ${sum("removed")} removed` +
      (errors.length ? ` · ${errors.join("; ")}` : ""), errors.length > 0);
    loadRoots();
    if (view === "files") listFiles(false);
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("reindex").disabled = false;
  }
});

const initial = new URLSearchParams(location.search);
for (const k of ["q", "dir", "path", "ext"]) if (initial.get(k)) $(k).value = initial.get(k);
$("raw").checked = initial.get("raw") === "true";

loadInfo();
loadRoots();
if (initial.get("view") === "files" || initial.get("view") === "defs") setView(initial.get("view"));
else if ($("q").value) runSearch();
</script>
</body>
</html>
